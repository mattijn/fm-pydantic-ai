[project]
name = "fm-pydantic-ai"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "apple-fm-sdk",
    "mcp>=2.3.0",
    "pydantic-ai-slim>=2.59.0",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.uv.workspace]
members = [
    "vendor/apple_fm_sdk-0.2.1",
]

[tool.uv.sources]
apple-fm-sdk = { workspace = true }

[tool.ruff]
line-length = 120
extend-exclude = ["vendor"]

[tool.mypy]
files = ["apple_fm_model.py", "weather_agent.py", "weather_mcp.py", "tests"]
strict = true

[[tool.mypy.overrides]]
module = "apple_fm_sdk.*"
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
