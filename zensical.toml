# The documentation, built with Zensical: uv run --group docs zensical serve
[project]
site_name = "fm-pydantic-ai"
site_url = "https://mattijn.github.io/fm-pydantic-ai/"
site_description = "Pydantic AI on Apple's on-device Foundation Model"
repo_url = "https://github.com/mattijn/fm-pydantic-ai"
repo_name = "mattijn/fm-pydantic-ai"
site_dir = "site"
nav = [
  { "Overview" = "index.md" },
  { "Installation" = "installation.md" },
  { "Usage" = "usage.md" },
  { "Evaluation" = "evaluation/index.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
toc.permalink = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}

[project.plugins.markdown-exec]
